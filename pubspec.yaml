name: farma_auth
description: "Internal use app for Farmaconsult employees to authenticate themself."
publish_to: 'none'
version: 1.13.01+3

environment:
  sdk: ^3.8.1

dependencies:
  android_id: ^0.5.1
  crypto: ^3.0.3
  device_info_plus: ^13.2.0
  ffi: ^2.1.0
  flutter:
    sdk: flutter  
  http: ^1.5.0
  intl: ^0.20.2
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  window_manager: ^0.5.1
  tray_manager: ^0.5.1
  window_size: ^0.2.0
  local_notifier: ^0.1.6
  win32: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - windows/runner/resources/tray_icon.ico
    - windows/runner/resources/app_icon.ico

flutter_launcher_icons:
  android: true
  image_path: lib/assets/icons/app_icon.png
